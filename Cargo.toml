[package]
name = "megacli"
version = "0.1.3"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }

# Crypto
aes = "0.8"
ctr = "0.9"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
rsa = "0.9"
num-bigint = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# CLI
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"

# Utils
rand = "0.8"
anyhow = "1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
dirs = "6"
toml = "0.8"
regex = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
