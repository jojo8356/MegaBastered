name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: megacli-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: megacli-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: megacli-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: megacli-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/megacli ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/megacli.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/megacli-linux-x86_64/megacli-linux-x86_64
            artifacts/megacli-macos-x86_64/megacli-macos-x86_64
            artifacts/megacli-macos-aarch64/megacli-macos-aarch64
            artifacts/megacli-windows-x86_64.exe/megacli-windows-x86_64.exe
